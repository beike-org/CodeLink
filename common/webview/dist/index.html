<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="ie=edge">
<link rel="shortcut icon" href="./favicon.svg">
<title>CodeLink</title>
<link rel="stylesheet" href="./umi.f1e330ef.css">
</head>
<body>
<div id="root"></div>
<script src="./umi.4058650e.js"></script>
<script>
    window.pluginConfig = window.pluginConfig || { theme: 'light' };
    if (window.pluginConfig.theme === "dark") {
      document.documentElement.style.backgroundColor = "rgb(30, 32, 33)";
    } else {
      var query = window.location.search.substring(1);
      var vars = query.split("&");
      for (var i = 0; i < vars.length; i++) {
        var pair = vars[i].split("=");
        if (pair[0] === "theme" && pair[1] === "dark") {
          document.documentElement.style.backgroundColor = "rgb(30, 32, 33)";
          break;
        }
      }
    }
    </script>
</body>
</html>
